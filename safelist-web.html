<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safelist · Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f4;--surface:#fff;--surface-2:#f7faf9;--ink:#0f2421;--muted:#5d6f6b;--line:#e0e8e6;--line-strong:#cbd8d5;
  --primary:#0b8a7e;--primary-strong:#076c63;--primary-soft:#e2f3f1;--primary-ink:#06574f;--on-primary:#fff;
  --side:#0d2b27;--side-2:#143c36;--side-ink:#d6e8e4;--side-muted:#7fa39c;
  --lime:#b9d63a;--lime-soft:#f1f7d6;--lime-ink:#55660a;
  --amber:#9a5a04;--amber-soft:#fff1d6;--red:#bb3828;--red-soft:#fde8e4;--blue:#2c64ad;--blue-soft:#e5eefa;
  --shadow:0 1px 2px rgba(16,36,33,.05),0 0.375rem 1.25rem rgba(16,36,33,.06);--shadow-lg:0 1.25rem 3.125rem rgba(10,30,27,.22);
  --radius:0.875rem;color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0a1412;--surface:#111e1b;--surface-2:#162622;--ink:#e5eeec;--muted:#93a8a3;--line:#22342f;--line-strong:#2e4540;
  --primary:#34c3b2;--primary-strong:#62d8ca;--primary-soft:#123b35;--primary-ink:#8de6da;--on-primary:#05221e;
  --side:#071210;--side-2:#11241f;--side-ink:#cfe3df;--side-muted:#6f918a;
  --lime-soft:#262e0e;--lime-ink:#d4ec70;--amber:#f0b957;--amber-soft:#33270e;--red:#f2836f;--red-soft:#3a1a15;--blue:#86adec;--blue-soft:#15243a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 0.375rem 1.25rem rgba(0,0,0,.25);color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* escala: 15px em notebooks, ~18px em 1920, até 20px em telas 2560+ */
html{font-size:clamp(15px,calc(.3125vw + 12px),20px)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:0.875rem;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}
[hidden]{display:none!important}
.ic{width:1.125rem;height:1.125rem;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:16rem minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:0.625rem;padding:1.125rem 1.125rem 0.875rem}
.logo{width:2.125rem;height:2.125rem;border-radius:0.625rem;background:linear-gradient(135deg,#19b3a3,#0b7d72);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo .ic{width:1.1875rem;height:1.1875rem}
.brand-name{font-weight:700;font-size:1rem;letter-spacing:-.01em;color:#fff}
.brand-sub{font-size:0.6875rem;color:var(--side-muted)}
.nav{flex:1;overflow-y:auto;padding:0.25rem 0.625rem 0.75rem;scrollbar-width:thin;scrollbar-color:#2a4d47 transparent}
.nav-group{font-size:0.6562rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:1rem 0.625rem 0.375rem}
.nav-item{width:100%;display:flex;align-items:center;gap:0.6875rem;padding:0.5rem 0.625rem;border:0;background:transparent;border-radius:0.5625rem;color:var(--side-ink);font-size:0.8438rem;text-align:left;cursor:pointer;opacity:.86;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);opacity:1}
.nav-item.active{background:var(--side-2);opacity:1;color:#fff;font-weight:600}
.nav-item.active:before{content:"";position:absolute;left:-10px;top:0.5rem;bottom:0.5rem;width:0.1875rem;border-radius:0 0.1875rem 0.1875rem 0;background:var(--lime)}
.nav-item .ic{width:1.0625rem;height:1.0625rem;opacity:.9}
.nav-count{margin-left:auto;font-size:0.6875rem;font-weight:600;background:rgba(185,214,58,.16);color:var(--lime);border-radius:6.1875rem;padding:1px 0.4375rem}
.side-foot{padding:0.75rem;border-top:1px solid rgba(255,255,255,.07)}
.ai-card{background:linear-gradient(160deg,#16443d,#0f322d);border:1px solid rgba(185,214,58,.18);border-radius:0.75rem;padding:0.75rem}
.ai-card b{display:flex;align-items:center;gap:0.4375rem;color:#fff;font-size:0.8125rem}
.ai-card b .ic{color:var(--lime);width:1rem;height:1rem}
.ai-card p{font-size:0.7188rem;color:var(--side-muted);margin-top:0.3125rem}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:0.75rem;height:3.875rem;padding:0 1.5rem;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(0.625rem);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:0.375rem;font-size:0.8125rem;color:var(--muted);white-space:nowrap;min-width:0}
.crumbs strong{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{width:0.875rem;height:0.875rem}
.search{position:relative;margin-left:auto;width:min(21.25rem,32vw)}
.search input{width:100%;height:2.375rem;border:1px solid var(--line);background:var(--surface-2);border-radius:0.625rem;padding:0 0.75rem 0 2.25rem;font-size:0.8125rem;outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 0.1875rem var(--primary-soft)}
.search>.ic{position:absolute;left:0.6875rem;top:0.625rem;color:var(--muted)}
.search kbd{position:absolute;right:0.5625rem;top:0.5625rem;font-size:0.6562rem;color:var(--muted);border:1px solid var(--line);border-radius:0.3125rem;padding:1px 0.3125rem;background:var(--surface);font-family:inherit}
.search-results{position:absolute;top:2.75rem;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:0.75rem;box-shadow:var(--shadow-lg);padding:0.375rem;max-height:22.5rem;overflow:auto}
.search-results button{width:100%;display:flex;gap:0.625rem;align-items:center;border:0;background:none;padding:0.5rem;border-radius:0.5rem;text-align:left;cursor:pointer}
.search-results button:hover,.search-results button:focus{background:var(--surface-2);outline:none}
.search-results small{display:block;color:var(--muted);font-size:0.7188rem}
.icon-btn{position:relative;display:grid;place-items:center;width:2.375rem;height:2.375rem;border-radius:0.625rem;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute;top:0.4375rem;right:0.5rem;width:0.5rem;height:0.5rem;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.profile{display:flex;align-items:center;gap:0.5625rem;border:1px solid var(--line);background:var(--surface);border-radius:0.75rem;padding:0.25rem 0.625rem 0.25rem 0.25rem;cursor:pointer;text-align:left}
.avatar{display:grid;place-items:center;width:1.875rem;height:1.875rem;border-radius:0.5625rem;background:var(--primary-soft);color:var(--primary-ink);font-weight:700;font-size:0.75rem;flex:0 0 auto}
.profile b{display:block;font-size:0.7812rem;font-weight:600;line-height:1.2}
.profile small{display:block;font-size:0.6875rem;color:var(--muted);line-height:1.2}
.popover{position:absolute;top:3.5rem;right:1.5rem;width:20.625rem;background:var(--surface);border:1px solid var(--line);border-radius:0.875rem;box-shadow:var(--shadow-lg);padding:0.5rem;z-index:50}
.pop-title{font-size:0.6875rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0.5rem 0.625rem 0.375rem}
.pop-item{width:100%;display:flex;gap:0.625rem;align-items:flex-start;border:0;background:none;text-align:left;padding:0.5625rem 0.625rem;border-radius:0.5625rem;cursor:pointer}
.pop-item:hover{background:var(--surface-2)}
.pop-item small{display:block;color:var(--muted);font-size:0.7188rem;margin-top:1px}
.pop-item.sel{background:var(--primary-soft)}
.pop-item .ic{margin-top:1px;color:var(--primary)}
.role-banner{display:flex;align-items:center;gap:0.625rem;background:var(--blue-soft);color:var(--blue);padding:0.5625rem 1.5rem;font-size:0.7812rem;border-bottom:1px solid var(--line)}
.role-banner button{margin-left:auto}

.content{padding:1.75rem 2rem 3rem;max-width:150rem;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.page-head h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.page-head p{color:var(--muted);margin-top:0.3125rem;max-width:45rem}
.page-actions{display:flex;gap:0.5rem;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.4375rem;height:2.375rem;padding:0 0.875rem;border-radius:0.625rem;border:1px solid var(--line-strong);background:var(--surface);font-size:0.8125rem;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:1rem;height:1rem}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.primary:hover{background:var(--primary-strong)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:1.875rem;padding:0 0.625rem;font-size:0.75rem;border-radius:0.5rem}
.btn.ai{border-color:color-mix(in srgb,var(--lime) 55%,var(--line));background:var(--lime-soft);color:var(--lime-ink)}
.btn.danger{color:var(--red)}
.field label,.lbl{display:block;font-size:0.75rem;font-weight:500;color:var(--muted);margin-bottom:0.375rem}
.field select,.field input,.field textarea,.inp{width:100%;min-height:2.5rem;border:1px solid var(--line-strong);border-radius:0.625rem;padding:0.5rem 0.6875rem;background:var(--surface);font-size:0.8438rem;outline:none}
.field textarea{resize:vertical;min-height:4.375rem}
.field select:focus,.field input:focus,.field textarea:focus,.inp:focus{border-color:var(--primary);box-shadow:0 0 0 0.1875rem var(--primary-soft)}
.toolbar{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1.125rem}
.toolbar .field{min-width:12.5rem}
.toolbar-note{margin-left:auto;display:flex;gap:0.375rem;align-items:center;font-size:0.75rem;color:var(--muted);padding-bottom:0.625rem}
.toolbar-note .ic{width:0.875rem;height:0.875rem}
.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:0.75rem;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;margin-bottom:1.125rem;box-shadow:var(--shadow)}
.check{display:flex;gap:0.5625rem;align-items:flex-start;font-size:0.8125rem;color:var(--muted);margin:0.75rem 0;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--primary);width:1rem;height:1rem}
.msg{font-size:0.8125rem;color:var(--primary-ink);min-height:1.25rem;margin-top:0.625rem}
.msg.warn{color:var(--amber)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.125rem;box-shadow:var(--shadow);min-width:0}
.card+.card,.grid-2+.card,.card+.grid-2,.grid-2+.grid-2{margin-top:1rem}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-bottom:0.75rem}
.card-head h2,.card>h2{font-size:0.9375rem;font-weight:600}
.card>h2{margin-bottom:0.75rem}
.card-head .muted{font-size:0.75rem}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.875rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0.875rem;margin-bottom:1rem}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);display:flex;gap:0.8125rem;align-items:flex-start}
.kpi-ic{width:2.375rem;height:2.375rem;border-radius:0.6875rem;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:0 0 auto}
.kpi-ic.warn{background:var(--amber-soft);color:var(--amber)}.kpi-ic.danger{background:var(--red-soft);color:var(--red)}.kpi-ic.info{background:var(--blue-soft);color:var(--blue)}.kpi-ic.ai{background:var(--lime-soft);color:var(--lime-ink)}
.kpi-label{font-size:0.7812rem;color:var(--muted)}
.kpi-value{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.kpi-note{font-size:0.75rem;color:var(--muted);margin-top:2px}
.callout{display:flex;gap:0.75rem;align-items:flex-start;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);color:var(--ink);border-radius:0.75rem;padding:0.8125rem 0.9375rem;font-size:0.8125rem;margin-bottom:1rem}
.callout>.ic{color:var(--primary);margin-top:1px}
.callout.ai{background:var(--lime-soft);border-color:color-mix(in srgb,var(--lime) 35%,transparent)}
.callout.ai>.ic{color:var(--lime-ink)}
.callout.warn{background:var(--amber-soft);border-color:transparent}.callout.warn>.ic{color:var(--amber)}
.empty{text-align:center;padding:2.625rem 1.25rem;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .em-ic{width:3.25rem;height:3.25rem;border-radius:1rem;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 0.75rem}
.empty .em-ic .ic{width:1.5rem;height:1.5rem}
.empty h3{font-size:0.9375rem;font-weight:600}
.empty p{color:var(--muted);font-size:0.8125rem;margin:0.375rem auto 0;max-width:28.75rem}
.empty .actions{margin-top:1rem;display:flex;justify-content:center;gap:0.5rem;flex-wrap:wrap}
.footnote{font-size:0.75rem;color:var(--muted);margin-top:0.75rem;display:flex;gap:0.375rem;align-items:flex-start}
.footnote .ic{width:0.875rem;height:0.875rem;margin-top:2px}
.quick{display:flex;gap:0.625rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{display:inline-flex;align-items:center;gap:0.5rem;background:var(--surface);border:1px solid var(--line);border-radius:6.1875rem;padding:0.375rem 0.75rem 0.375rem 0.5rem;font-size:0.7812rem}
.chip b{font-weight:600}
.chip .ic{width:0.9375rem;height:0.9375rem;color:var(--amber)}

/* ---------- tables ---------- */
.table-card{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card .table-card{border-radius:0.625rem}
.tbl{width:100%;border-collapse:collapse;font-size:0.8125rem;min-width:40rem}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:0.6875rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0.625rem 0.875rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0.75rem 0.875rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .nowrap{white-space:nowrap}
.cell-main{font-weight:600}
.cell-sub{display:block;color:var(--muted);font-size:0.75rem;margin-top:2px;font-weight:400}
.empty-row{text-align:center;color:var(--muted);padding:1.625rem!important}
.count{font-size:0.7812rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:0.375rem;padding:0.1875rem 0.5625rem;border-radius:6.1875rem;font-size:0.75rem;font-weight:500;white-space:nowrap}
.badge:before{content:"";width:0.375rem;height:0.375rem;border-radius:50%;background:currentColor}
.badge.ok{background:var(--primary-soft);color:var(--primary-ink)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.danger{background:var(--red-soft);color:var(--red)}
.badge.info{background:var(--blue-soft);color:var(--blue)}
.badge.ai{background:var(--lime-soft);color:var(--lime-ink)}
.tag{display:inline-block;font-size:0.6875rem;font-weight:600;padding:2px 0.4375rem;border-radius:0.375rem;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.h{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.hia{background:var(--lime-soft);color:var(--lime-ink);border-color:transparent}
.docs-bar{display:flex;align-items:center;gap:0.5rem;white-space:nowrap}
.mini-track{width:3.5rem;height:0.375rem;border-radius:0.5625rem;background:var(--line);overflow:hidden}
.mini-track i{display:block;height:100%;background:var(--primary);border-radius:0.5625rem}
.mini-track i.warn{background:var(--amber)}
.steps-dots{display:flex;gap:0.25rem;align-items:center}
.steps-dots i{width:1rem;height:0.375rem;border-radius:0.5625rem;background:var(--line)}
.steps-dots i.on{background:var(--primary)}
.steps-dots i.cur{background:var(--amber)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:0.625rem 0.875rem;font-size:0.8438rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:0.4375rem}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--primary-ink);border-bottom-color:var(--primary);font-weight:600}
.tabs .nav-count{background:var(--primary-soft);color:var(--primary-ink)}

/* ---------- dashboard ---------- */
.bar-row{display:grid;grid-template-columns:6.875rem minmax(3.75rem,1fr) 3.5rem;gap:0.75rem;align-items:center;padding:0.625rem 0;border-bottom:1px solid var(--line);font-size:0.8125rem}
.bar-row:last-child{border-bottom:0}
.track{height:0.5625rem;border-radius:6.1875rem;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:6.1875rem;background:linear-gradient(90deg,var(--primary),#1fb3a2);transition:width .5s}
.bar-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:0.75rem;padding:0.6875rem 0;border-bottom:1px solid var(--line);font-size:0.8125rem}
.list-row:last-child{border-bottom:0}
.list-row .l{display:flex;gap:0.6875rem;align-items:center;min-width:0}
.list-ic{width:2rem;height:2rem;border-radius:0.5625rem;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.list-ic .ic{width:1rem;height:1rem}
.attention{color:var(--amber);font-weight:500}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0.25rem}
.cal .dow{font-size:0.6875rem;color:var(--muted);text-align:center;padding:0.25rem 0;font-weight:600}
.cal .day{min-height:4.125rem;border:1px solid var(--line);border-radius:0.5625rem;padding:0.3125rem 0.375rem;font-size:0.75rem;background:var(--surface)}
.cal .day.out{background:transparent;border-style:dashed;opacity:.5}
.cal .day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .day b{font-weight:600;font-size:0.75rem}
.cal .ev{display:block;margin-top:0.1875rem;font-size:0.6562rem;line-height:1.25;padding:2px 0.3125rem;border-radius:0.3125rem;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.t{background:var(--blue-soft);color:var(--blue)}

/* ---------- activities editor ---------- */
.split{display:grid;grid-template-columns:18.125rem minmax(0,1fr);gap:1rem;align-items:start}
.act-list{display:grid;gap:0.5rem}
.act-item{border:1px solid var(--line);background:var(--surface);border-radius:0.75rem;padding:0.75rem 0.8125rem;text-align:left;cursor:pointer;display:block;width:100%}
.act-item:hover{border-color:var(--line-strong)}
.act-item.active{border-color:var(--primary);box-shadow:0 0 0 0.1875rem var(--primary-soft)}
.act-item b{display:block;font-size:0.8438rem}
.act-item small{display:block;color:var(--muted);font-size:0.75rem;margin:2px 0 0.4375rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
.form-grid .full{grid-column:1/-1}
.check-tbl input[type=text]{width:100%;min-height:2.25rem;border:1px solid var(--line);border-radius:0.5rem;padding:0.375rem 0.5625rem;background:var(--surface-2)}
.check-tbl input[type=checkbox]{width:1.0625rem;height:1.0625rem;accent-color:var(--primary)}
.actions-row{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0.5rem}
.flow-step{border:1px solid var(--line);border-radius:0.6875rem;padding:0.625rem;background:var(--surface-2);position:relative}
.flow-step .n{font-size:0.6562rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.flow-step b{display:block;font-size:0.7812rem;margin:0.1875rem 0 0.4375rem;line-height:1.3}
.flow-step small{display:block;font-size:0.6875rem;color:var(--muted);margin-top:0.3125rem}

/* ---------- steps (QR / desvios) ---------- */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0.625rem;margin-bottom:1rem}
.step{background:var(--surface);border:1px solid var(--line);border-top:0.1875rem solid var(--primary);border-radius:0.75rem;padding:0.8125rem}
.step .n{font-size:0.6562rem;font-weight:700;color:var(--primary);letter-spacing:.06em}
.step b{display:block;font-size:0.8125rem;margin:0.1875rem 0 0.25rem}
.step p{font-size:0.75rem;color:var(--muted)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.125rem,1fr));gap:0.875rem}
.qr-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0.875rem;display:flex;flex-direction:column;gap:0.625rem;box-shadow:var(--shadow)}
.qr-card .qr-wrap{display:grid;place-items:center;background:#fff;border-radius:0.625rem;padding:0.625rem;border:1px solid var(--line)}
.qr{color:#10221f;display:block}
.qr-card b{font-size:0.8438rem}
.qr-card small{color:var(--muted);font-size:0.75rem;display:block}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,20,18,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(35rem,100vw);background:var(--surface);z-index:70;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.dr-head{display:flex;gap:0.75rem;align-items:flex-start;padding:1.125rem 1.25rem;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:1.0625rem}
.dr-head p{color:var(--muted);font-size:0.7812rem;margin-top:0.1875rem}
.dr-head .icon-btn{margin-left:auto}
.dr-body{flex:1;overflow-y:auto;padding:1.125rem 1.25rem}
.dr-foot{padding:0.875rem 1.25rem;border-top:1px solid var(--line);display:flex;gap:0.5rem;justify-content:flex-end;flex-wrap:wrap}
.dr-sec{margin-bottom:1.25rem}
.dr-sec h3{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:0.5625rem;display:flex;align-items:center;gap:0.5rem}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.625rem}
.kv div{background:var(--surface-2);border:1px solid var(--line);border-radius:0.625rem;padding:0.5625rem 0.6875rem}
.kv small{display:block;font-size:0.7188rem;color:var(--muted)}
.kv b{font-size:0.8125rem;font-weight:600}
.timeline{border-left:2px solid var(--line);margin-left:0.375rem;padding-left:1rem}
.timeline div{position:relative;padding-bottom:0.75rem;font-size:0.8125rem}
.timeline div:before{content:"";position:absolute;left:-22px;top:0.3125rem;width:0.625rem;height:0.625rem;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.timeline small{display:block;color:var(--muted);font-size:0.7188rem}
.risk-matrix{display:grid;grid-template-columns:1.75rem repeat(5,1fr);gap:0.1875rem;font-size:0.6875rem}
.risk-matrix .ax{display:grid;place-items:center;color:var(--muted);font-weight:600}
.risk-matrix button{aspect-ratio:1.6;border:0;border-radius:0.375rem;cursor:pointer;font-size:0.6875rem;font-weight:600;color:rgba(0,0,0,.6)}
.risk-matrix button.sel{outline:0.1875rem solid var(--ink);outline-offset:-3px}
.ishikawa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.5rem}
.ishikawa div{border:1px solid var(--line);border-radius:0.625rem;padding:0.5625rem 0.625rem;background:var(--surface-2);font-size:0.7812rem}
.ishikawa b{display:block;font-size:0.7188rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:0.25rem}
.ishikawa li{margin:2px 0}
.ishikawa ul{margin:0;padding-left:1rem}
.ishikawa li.ia{color:var(--lime-ink);font-style:italic}
.whys{counter-reset:w;display:grid;gap:0.375rem}
.whys div{counter-increment:w;display:flex;gap:0.625rem;align-items:baseline;font-size:0.8125rem;background:var(--surface-2);border:1px solid var(--line);border-radius:0.5625rem;padding:0.5rem 0.6875rem}
.whys div:before{content:counter(w) "º";font-weight:700;color:var(--primary);font-size:0.75rem}
.photo-strip{display:flex;gap:0.5rem;flex-wrap:wrap}
.photo{width:4.625rem;height:3.625rem;border-radius:0.5625rem;background:linear-gradient(135deg,#7aa59d,#355e57);display:grid;place-items:center;color:rgba(255,255,255,.85)}
.photo .ic{width:1.125rem;height:1.125rem}

/* ---------- toast ---------- */
.toasts{position:fixed;bottom:1.375rem;right:1.375rem;display:grid;gap:0.625rem;z-index:90}
.toast{display:flex;gap:0.6875rem;align-items:flex-start;width:22.5rem;max-width:calc(100vw - 2rem);background:var(--ink);color:var(--bg);border-radius:0.75rem;padding:0.75rem 0.875rem;box-shadow:var(--shadow-lg);font-size:0.8125rem;animation:tin .25s ease}
.toast .ic{color:var(--lime);margin-top:1px}
.toast button{margin-left:auto;background:none;border:0;color:var(--lime);font-weight:600;cursor:pointer;font-size:0.7812rem;white-space:nowrap}
@keyframes tin{from{transform:translateY(0.625rem);opacity:0}}
.flash td{animation:flash 2.4s ease}
@keyframes flash{0%,40%{background:var(--lime-soft)}}

/* barra lateral recolhida (desktop) */
@media (min-width:981px){
  .app.collapsed{grid-template-columns:4.5rem minmax(0,1fr)}
  .app.collapsed .brand{justify-content:center;padding:1.125rem 0 .875rem}
  .app.collapsed .brand>div:last-child,.app.collapsed .side-foot,.app.collapsed .nav-item span{display:none}
  .app.collapsed .nav{padding:.25rem .625rem .75rem}
  .app.collapsed .nav-group{font-size:0;padding:0;margin:.625rem .5rem;border-top:1px solid rgba(255,255,255,.09)}
  .app.collapsed .nav-item{justify-content:center;padding:.625rem 0}
  .app.collapsed .nav-item.active:before{left:-.625rem}
  .app.collapsed .nav-item .nav-count{display:block;position:absolute;top:.3rem;right:.45rem;width:.5rem;height:.5rem;padding:0;font-size:0;background:var(--lime)}
}
/* ---------- responsive ---------- */
@media (max-width:1180px){.flow{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:1fr}.act-list{grid-template-columns:repeat(auto-fill,minmax(13.75rem,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:17rem;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile span.pt{display:none}
}
@media (max-width:720px){
  .topbar{padding:0 0.875rem;gap:0.5rem}
  .search{width:auto;flex:1}
  .search kbd{display:none}
  .content{padding:1.125rem 1rem 2.5rem}
  .filters{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .kpis,.kpis.k3{grid-template-columns:1fr}
  .crumbs{display:none}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ishikawa{grid-template-columns:1fr 1fr}
  .popover{right:0.75rem;left:0.75rem;width:auto}
  .toolbar-note{margin-left:0}
}
@media (max-width:480px){.filters{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.cal .day{min-height:2.75rem}.cal .ev{display:none}.cal .day.has:after{content:"";display:block;width:0.375rem;height:0.375rem;border-radius:50%;background:var(--primary);margin-top:0.25rem}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><div class="brand-name">Safelist</div><div class="brand-sub">Gestão de segurança · Web</div></div>
    </div>
    <nav class="nav" id="nav" aria-label="Menu principal"></nav>
    <div class="side-foot">
      <div class="ai-card" id="ai-card"></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Abrir menu"></button>
      <div class="crumbs"><span>Segurança do trabalho</span><span id="crumb-sep"></span><strong id="breadcrumb">Painel geral</strong></div>
      <div class="search" id="search-box">
        <span id="search-ic"></span>
        <input id="global-search" type="search" placeholder="Buscar cadastro, ocorrência, documento…" aria-label="Busca global" autocomplete="off">
        <kbd>/</kbd>
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <button class="icon-btn" id="bell-btn" type="button" aria-label="Notificações"><span id="bell-ic"></span><span class="dot" id="bell-dot"></span></button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar para tema escuro" title="Alternar tema"></button>
      <button class="profile" id="profile-btn" type="button" aria-label="Perfil do usuário"><span class="avatar">TS</span><span class="pt"><b>Tiago Santos</b><small id="role-label">Administração</small></span></button>
    </header>
    <div class="role-banner" id="role-banner" hidden></div>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="popover" id="notif-pop" hidden></div>
<div class="popover" id="profile-pop" hidden></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head"><div><h2 id="dr-title"></h2><p id="dr-sub"></p></div><button class="icon-btn" id="dr-close" type="button" aria-label="Fechar painel"></button></div>
  <div class="dr-body" id="dr-body"></div>
  <div class="dr-foot" id="dr-foot"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
/* =========================================================
   Utilidades
   ========================================================= */
const ICONS={
  grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',

  clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  filecheck:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="m9 15 2 2 4-4"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  grad:'<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  hardhat:'<path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M14 6a6 6 0 0 1 6 6v3"/><path d="M4 15v-3a6 6 0 0 1 6-6"/><rect x="2" y="15" width="20" height="4" rx="1"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6M16 13H8M16 17H8M10 9H8"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  phone:'<rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M12 18h.01"/>',
  sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15v4M17 17h4M5 3v3M3.5 4.5h3"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  refresh:'<path d="M21 12a9 9 0 0 1-15.36 6.36L3 16M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  printer:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
  eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  filter:'<path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,c)=>'<svg class="ic '+(c||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||"")+'</svg>';
function tone(s){s=String(s).toLowerCase();
  if(/não conforme|fora do prazo|vencid|recusad|abaixo|crític|bloquead/.test(s))return"danger";
  if(/regular|aprovad|conclu|anexad|enviad|liberad|publicad|ativo|em dia|conforme|realizad|encerrad|sincronizad/.test(s))return"ok";
  if(/aguard|pend|atenç|revis|confer|ajuste|investig|rascunho|andamento|execução|preenchimento|hoje|precisa/.test(s))return"warn";
  return"info";}
const badge=(s,t)=>'<span class="badge '+(t||tone(s))+'">'+esc(s)+'</span>';
const docsParts=d=>{const m=String(d).match(/(\d+) de (\d+)/);return m?[+m[1],+m[2]]:[0,0];};
const todayBR=()=>new Intl.DateTimeFormat("pt-BR").format(new Date(2026,10,1));
const nowStamp=()=>new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date());
function pageHead(t,d,a){return '<div class="page-head"><div><h1 id="page-title">'+t+'</h1><p>'+d+'</p></div><div class="page-actions">'+(a||"")+'</div></div>';}
function kpi(label,value,note,icon,t,id){return '<div class="kpi"><div class="kpi-ic '+(t||"")+'">'+ic(icon)+'</div><div><div class="kpi-label">'+label+'</div><div class="kpi-value"'+(id?' id="'+id+'"':"")+'>'+value+'</div>'+(note!==null&&note!==undefined?'<div class="kpi-note"'+(id?' id="'+id+'-note"':"")+'>'+note+'</div>':"")+'</div></div>';}
function table(cols,rows,o){o=o||{};
  return '<div class="table-card"><table class="tbl"'+(o.label?' aria-label="'+o.label+'"':"")+(o.min?' style="min-width:'+(o.min/16)+'rem"':"")+'><thead><tr>'+cols.map(c=>'<th>'+c.label+'</th>').join("")+'</tr></thead><tbody'+(o.id?' id="'+o.id+'"':"")+'>'+tbodyRows(cols,rows,o)+'</tbody></table></div>';}
function tbodyRows(cols,rows,o){o=o||{};
  if(!rows.length)return '<tr><td colspan="'+cols.length+'" class="empty-row">'+(o.empty||"Nenhum registro encontrado.")+'</td></tr>';
  return rows.map((r,i)=>'<tr'+(o.click?' class="click" tabindex="0" data-i="'+i+'"':"")+'>'+cols.map(c=>'<td class="'+(c.cls||"")+'">'+(c.render?c.render(r,i):esc(r[c.key]))+'</td>').join("")+'</tr>').join("");}
function tabsHtml(list,active){return '<div class="tabs" role="tablist">'+list.map(t=>'<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===active)+'" class="'+(t[0]===active?"active":"")+'">'+t[1]+(t[2]?' <span class="nav-count">'+t[2]+'</span>':"")+'</button>').join("")+'</div>';}
function bindTabs(host,fn){$$("[data-tab]",host).forEach(b=>b.addEventListener("click",()=>{$$("[data-tab]",host).forEach(x=>{const a=x===b;x.classList.toggle("active",a);x.setAttribute("aria-selected",String(a));});fn(b.dataset.tab);}));}
function bindRows(host,rows,fn){$$("tr.click",host).forEach(tr=>{const go=()=>fn(rows[+tr.dataset.i]);tr.addEventListener("click",go);tr.addEventListener("keydown",e=>{if(e.key==="Enter")go();});});}
function selectHtml(id,opts,val){return '<select id="'+id+'">'+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(v===val?" selected":"")+'>'+esc(l)+'</option>';}).join("")+'</select>';}

function qrSvg(seed,size){const n=25;let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};let r="";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;if(rnd()>.52)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';}
  const f=(x,y)=>'<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>';
  return '<svg class="qr" viewBox="-1 -1 '+(n+2)+' '+(n+2)+'" width="'+size+'" height="'+size+'" shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect x="-1" y="-1" width="'+(n+2)+'" height="'+(n+2)+'" fill="#fff"/><g fill="currentColor">'+r+f(0,0)+f(n-7,0)+f(0,n-7)+'</g></svg>';}

/* ---------- App Android · sincronização ---------- */
VIEWS.app=function(host){
  host.innerHTML=pageHead("App Android","Prévia do acesso às inspeções de campo e da sincronização manual. No Android, a sincronização é iniciada pela pessoa quando desejar; os registros continuam salvos no aparelho até serem enviados.",'<a class="btn" href="safelist-app.html" target="_blank" rel="noopener">'+ic("phone")+'Abrir protótipo do app</a>')+
  '<div class="grid-2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)"><section class="card"><div style="text-align:center;padding:4px 4px 14px"><span class="kpi-ic" style="margin:0 auto 10px;width:46px;height:46px">'+ic("phone")+'</span><h2 style="font-size:15px">Menu principal · App Android</h2><p class="muted" style="margin-top:4px">Acesso rápido às atividades e aos registros de campo.</p></div>'+
  '<div class="list-row"><b>Inspeções e atividades</b><span class="muted">Disponível no aparelho</span></div><div class="list-row"><b>Comunicações de incidentes</b><span class="muted" id="sync-pending">'+syncInfo.pending+'</span></div><div class="list-row"><b>Última sincronização</b><span class="muted" id="sync-last">'+syncInfo.last+'</span></div>'+
  '<div style="display:flex;justify-content:center;padding:16px 0 4px"><button id="sync-now" class="btn primary" type="button">'+ic("refresh")+'Sincronizar agora</button></div><div id="sync-message" class="msg" role="status" aria-live="polite" style="text-align:center"></div><p class="footnote" style="justify-content:center;text-align:center">Ao consultar um QR com internet, o app busca o status mais recente disponível. Sem conexão, mostra a data da última atualização guardada.</p></section>'+
  '<section class="card"><div class="card-head"><h2>Aparelhos em campo</h2></div>'+table([{label:"Usuário",render:d=>'<span class="cell-main">'+esc(d.user)+'</span><span class="cell-sub">'+esc(d.device)+'</span>'},{label:"Parque",key:"park"},{label:"Última sincronização",key:"last"},{label:"Pendentes",render:d=>d.pending?badge(d.pending+" aguardando envio","warn"):badge("Sincronizado","ok")}],devices,{min:520})+
  '<div class="card-head" style="margin-top:18px"><h2>Integrações · matriz unificada</h2></div>'+[["Greenlegis","Requisitos legais · somente leitura","Demonstração"],["Obrasoft","Fonte externa conectada à matriz","Planejada"],["AppSheet","Inspeções, REX e DDS existentes","Migração planejada"],["Google Workspace","Login corporativo e diretório","Ativo"]].map(x=>'<div class="list-row"><div class="l"><span class="list-ic">'+ic("link")+'</span><span><b>'+x[0]+'</b><span class="cell-sub">'+x[1]+'</span></span></div>'+badge(x[2],x[2]==="Ativo"?"ok":"info")+'</div>').join("")+'</section></div>';
  $("#sync-now").addEventListener("click",()=>{const now=nowStamp();syncInfo.last=now;syncInfo.pending="Nenhum registro aguardando envio";$("#sync-last").textContent=now;$("#sync-pending").textContent=syncInfo.pending;$("#sync-message").textContent="Sincronização concluída nesta demonstração.";});
};

function bindGo(el){$$("[data-go]",el).forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));}
const _go=go;go=function(v,o){_go(v,o);bindGo($("#view"));};

/* =========================================================
   Topbar: tema, notificações, perfil, busca
   ========================================================= */
function setTheme(t){state.theme=t;document.documentElement.dataset.theme=t;const dark=t==="dark";$("#theme-toggle").innerHTML=ic(dark?"sun":"moon");$("#theme-toggle").setAttribute("aria-label",dark?"Alternar para tema claro":"Alternar para tema escuro");}
function setRole(r){state.role=r;$("#role-label").textContent=ROLES[r].label;const b=$("#role-banner");
  if(r==="admin"){b.hidden=true;}else{b.hidden=false;b.innerHTML=ic("eye")+'<span>Visualizando como <b>'+ROLES[r].label+'</b> · '+ROLES[r].desc+'. O menu mostra apenas os recursos deste perfil.</span><button class="btn sm" type="button" id="role-reset">Voltar para Administração</button>';$("#role-reset").addEventListener("click",()=>setRole("admin"));}
  $("#profile-pop").hidden=true;go(allowed(state.view)?state.view:"__");}
function renderNotif(){$("#notif-pop").innerHTML='<div class="pop-title">Notificações</div>'+notifications.map((n,i)=>'<button class="pop-item" type="button" data-n="'+i+'">'+ic(n.icon)+'<span><b style="font-weight:600">'+esc(n.title)+'</b><small>'+esc(n.sub)+'</small></span></button>').join("");
  $$("[data-n]",$("#notif-pop")).forEach(b=>b.addEventListener("click",()=>{const n=notifications[+b.dataset.n];$("#notif-pop").hidden=true;go(n.view,n.opts);}));}
function renderProfile(){$("#profile-pop").innerHTML='<div style="display:flex;gap:10px;align-items:center;padding:8px 10px 10px"><span class="avatar">TS</span><span><b>Tiago Santos</b><small class="muted" style="display:block;font-size:12px">tiago.santos@empresa.com.br · Conta Google</small></span></div><div class="pop-title">Visualizar como</div>'+
  Object.keys(ROLES).map(k=>'<button class="pop-item'+(k===state.role?" sel":"")+'" type="button" data-role="'+k+'">'+ic(k===state.role?"check":"user")+'<span><b style="font-weight:600">'+ROLES[k].label+'</b><small>'+ROLES[k].desc+'</small></span></button>').join("");
  $$("[data-role]",$("#profile-pop")).forEach(b=>b.addEventListener("click",()=>setRole(b.dataset.role)));}
function toggle(id){const el=$(id),open=el.hidden;$$(".popover").forEach(p=>p.hidden=true);el.hidden=!open;}
$("#bell-btn").addEventListener("click",e=>{e.stopPropagation();renderNotif();toggle("#notif-pop");$("#bell-dot").hidden=true;});
$("#profile-btn").addEventListener("click",e=>{e.stopPropagation();renderProfile();toggle("#profile-pop");});
document.addEventListener("click",e=>{if(!e.target.closest(".popover"))$$(".popover").forEach(p=>p.hidden=true);if(!e.target.closest("#search-box"))$("#search-results").hidden=true;});
$("#theme-toggle").addEventListener("click",()=>setTheme(state.theme==="light"?"dark":"light"));
function setCollapsed(c){$(".app").classList.toggle("collapsed",c);$("#menu-btn").setAttribute("aria-label",c?"Expandir menu lateral":"Recolher menu lateral");$("#menu-btn").title=c?"Expandir menu":"Recolher menu";try{localStorage.setItem("safelist-collapsed",c?"1":"");}catch(e){}}
$("#menu-btn").addEventListener("click",()=>{if(innerWidth<=980){$("#sidebar").classList.add("open");$("#scrim").classList.add("on");}else setCollapsed(!$(".app").classList.contains("collapsed"));});
try{setCollapsed(localStorage.getItem("safelist-collapsed")==="1");}catch(e){setCollapsed(false);}
$("#scrim").addEventListener("click",()=>{$("#sidebar").classList.remove("open");closeDrawer();$("#scrim").classList.remove("on");});
$("#dr-close").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();$$(".popover").forEach(p=>p.hidden=true);$("#search-results").hidden=true;}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#global-search").focus();}});
const search=$("#global-search");
search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase(),box=$("#search-results");if(q.length<2){box.hidden=true;return;}
  const hits=records.filter(r=>(r.name+" "+r.id+" "+r.owner).toLowerCase().includes(q)).map(r=>({i:kindIcon(r.kind),t:r.name,s:r.kind+" · "+r.id+" · "+r.park,f:()=>openRecord(r)}))
    .concat(incidentRecords.filter(r=>(r.id+" "+r.title+" "+r.type).toLowerCase().includes(q)).map(r=>({i:"alert",t:r.id+" · "+r.title,s:r.type+" · "+r.park,f:()=>openIncident(r)})))
    .concat(permits.filter(p=>(p.id+" "+p.activity+" "+p.place).toLowerCase().includes(q)).map(p=>({i:"filecheck",t:p.id+" · "+p.activity,s:p.place,f:()=>openPermit(p)})));
  box.innerHTML=hits.length?hits.slice(0,8).map((h,i)=>'<button type="button" data-h="'+i+'"><span class="list-ic">'+ic(h.i)+'</span><span><b style="font-weight:600">'+esc(h.t)+'</b><small>'+esc(h.s)+'</small></span></button>').join(""):'<p class="muted" style="padding:10px;font-size:13px">Nenhum resultado para “'+esc(search.value)+'”.</p>';
  box.hidden=false;$$("[data-h]",box).forEach(b=>b.addEventListener("click",()=>{hits[+b.dataset.h].f();box.hidden=true;search.value="";}));});

/* =========================================================
   Integração com o protótipo do app (página lado a lado)
   ========================================================= */
window.addEventListener("message",e=>{const d=e.data||{};
  if(d.type==="safelist-theme")setTheme(d.theme);
  if(d.type==="safelist-navigate")go(d.view,d.opts);
  if(d.type==="safelist-sync"){const p=d.payload||{};let n=0;
    (p.incidents||[]).forEach(r=>{incidentRecords.unshift(Object.assign({fresh:true},r));n++;});
    (p.deliveries||[]).forEach(r=>{epiDeliveries.unshift(Object.assign({app:true},r));const s=epiStock.find(x=>x.name===r.epi);if(s)s.stock=Math.max(0,s.stock-r.qty);n++;});
    (p.permits||[]).forEach(r=>{permits.unshift(r);n++;});
    (p.deviations||[]).forEach(r=>{deviations.unshift(r);n++;});
    (p.inspections||[]).forEach(r=>{inspections.unshift(r);n++;});
    (p.trainings||[]).forEach(r=>{trainings.unshift(r);n++;});
    syncInfo.last=p.time||nowStamp();syncInfo.pending="Nenhum registro aguardando envio";devices[0].last=syncInfo.last;devices[0].pending=0;
    const target=(p.incidents||[]).length?["incidentes",{submitted:true}]:(p.permits||[]).length?["liberacoes"]:(p.deviations||[]).length?["incidentes",{tab:"nc"}]:(p.deliveries||[]).length?["epis"]:(p.inspections||[]).length?["inspecoes"]:["app"];
    notifications.unshift({icon:"phone",title:n+" registro"+(n===1?"":"s")+" recebido"+(n===1?"":"s")+" do app",sub:"Tiago Santos · Samsung Galaxy A54 · "+syncInfo.last,view:target[0],opts:target[1]});$("#bell-dot").hidden=false;
    renderNav();if(["app","overview"].includes(state.view))go(state.view);
    toast((n?n+" registro"+(n===1?"":"s")+" sincronizado"+(n===1?"":"s"):"Sincronização recebida")+" do app de campo (Tiago Santos).",n?"Ver registros":null,()=>go(target[0],target[1]));}
});

/* ---------- init ---------- */
$("#logo").innerHTML=ic("shield");$("#menu-btn").innerHTML=ic("menu");$("#crumb-sep").innerHTML=ic("chev");$("#search-ic").outerHTML=ic("search");$("#bell-ic").outerHTML=ic("bell");$("#dr-close").innerHTML=ic("x");
$("#ai-card").innerHTML='<b>'+ic("sparkles")+'IA no ponto certo</b><p>Gem, Gemini e NotebookLM apoiam preparação, consulta e análise. Execução, julgamento e validação permanecem humanas.</p>';
const params=new URLSearchParams(location.search);
setTheme(params.get("theme")==="dark"?"dark":"light");
const start=(location.hash||"").slice(1);go(LABEL[start]?start:"overview");
addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(LABEL[v]&&v!==state.view)go(v);});
})();
</script>
