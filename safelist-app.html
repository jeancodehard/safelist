<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b27">
<title>Safelist · App Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f4;--surface:#fff;--surface-2:#f6f9f8;--ink:#0f2421;--muted:#5d6f6b;--line:#e1e9e7;--line-strong:#cdd9d6;
  --primary:#0b8a7e;--primary-strong:#076c63;--primary-soft:#e2f3f1;--primary-ink:#06574f;--on-primary:#fff;
  --brand:#0d2b27;--brand-2:#143c36;--lime:#b9d63a;--lime-soft:#f1f7d6;--lime-ink:#55660a;
  --amber:#9a5a04;--amber-soft:#fff1d6;--red:#bb3828;--red-soft:#fde8e4;--blue:#2c64ad;--blue-soft:#e5eefa;
  --shadow:0 1px 2px rgba(16,36,33,.06),0 4px 14px rgba(16,36,33,.07);color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#0a1412;--surface:#121f1c;--surface-2:#172723;--ink:#e5eeec;--muted:#93a8a3;--line:#22342f;--line-strong:#2e4540;
  --primary:#34c3b2;--primary-strong:#62d8ca;--primary-soft:#123b35;--primary-ink:#8de6da;--on-primary:#05221e;
  --brand:#071210;--brand-2:#11241f;--lime-soft:#262e0e;--lime-ink:#d4ec70;--amber:#f0b957;--amber-soft:#33270e;--red:#f2836f;--red-soft:#3a1a15;--blue:#86adec;--blue-soft:#15243a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- moldura do aparelho ---------- */
body.framed{background:radial-gradient(1200px 700px at 30% 10%,#17463f 0%,#0b231f 55%,#071815 100%);display:grid;place-items:center;overflow:hidden}
.stage{display:flex;align-items:center;gap:56px}
.stage-info{max-width:320px;color:#d6e8e4}
.stage-info h1{font-size:30px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:14px 0 8px}
.stage-info p{color:#8fb1aa;font-size:14.5px;line-height:1.55}
.stage-info .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--lime);border:1px solid rgba(185,214,58,.4);padding:4px 9px;border-radius:6px}
.stage-info ul{padding:0;margin:20px 0 0;list-style:none;display:grid;gap:9px;font-size:13.5px}
.stage-info li{display:flex;gap:9px;align-items:center}
.stage-info li .ic{color:var(--lime);width:17px;height:17px}
.stage-info a{color:var(--lime)}
.device{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
body.framed .device{border-radius:52px;box-shadow:0 0 0 11px #0f1716,0 0 0 13px #2b3a37,0 40px 80px rgba(0,0,0,.5);transform-origin:center}
body.framed .device:after{content:"";position:absolute;top:11px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#050909;z-index:100;box-shadow:0 0 0 2px #121c1a}
body.embedded,body.native{overflow:hidden}
body.embedded .device,body.native .device{width:100vw;height:100vh;height:100dvh}
body.native .statusbar{display:none}
body:not(.framed) .stage{display:block}
body:not(.framed) .stage-info{display:none}
@media (max-width:980px){.stage-info{display:none}}

/* ---------- status bar ---------- */
.statusbar{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 30px;font-size:13.5px;font-weight:600;background:var(--sb,var(--surface));color:var(--sb-ink,var(--ink));transition:background .2s}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.statusbar .ic{width:16px;height:16px;stroke-width:2.2}
.device.dark-top{--sb:var(--brand);--sb-ink:#fff}
.device.cam-top{--sb:#000;--sb-ink:#fff}

/* ---------- estrutura de tela ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.appbar{display:flex;align-items:center;gap:6px;min-height:58px;padding:6px 8px 6px 6px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.appbar .ab-t{flex:1;min-width:0;padding-left:6px}
.appbar .ab-t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ab-t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative;color:inherit}
.ib:active{background:var(--surface-2)}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;scrollbar-width:none;overscroll-behavior:contain}
.content::-webkit-scrollbar{display:none}
.content.nopad{padding:0}
.content.anim-push{animation:push .26s cubic-bezier(.2,.8,.2,1)}
.content.anim-pop{animation:popin .22s ease}
.content.anim-fade{animation:fade .18s ease}
@keyframes push{from{transform:translateX(26px);opacity:0}}
@keyframes popin{from{transform:translateX(-18px);opacity:.3}}
@keyframes fade{from{opacity:0}}
.footer{flex:0 0 auto;padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.footer .btn{flex:1}

/* ---------- bottom nav ---------- */
.bnav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 10px;position:relative}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:pointer;padding:0;font-weight:500}
.bnav .pill{width:56px;height:30px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.bnav button.on{color:var(--ink);font-weight:600}
.bnav button.on .pill{background:var(--primary-soft);color:var(--primary-ink)}
.bnav .fab{width:58px;height:58px;border-radius:19px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 8px 20px rgba(13,43,39,.35);border:3px solid var(--surface)}
:root[data-theme="dark"] .bnav .fab{background:var(--primary);color:var(--on-primary)}
.bnav .fab .ic{width:26px;height:26px}
.bnav .badge-n{position:absolute;top:-2px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.bnav .pill{position:relative}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ai{background:var(--lime-soft);border-color:color-mix(in srgb,var(--lime) 50%,transparent);color:var(--lime-ink)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec-t h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-t a,.sec-t button.link{font-size:13px;color:var(--primary-ink);font-weight:600;background:none;border:0;cursor:pointer;padding:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface-2)}
.li .li-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.li .li-ic.ok{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.li .li-ic.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.li .li-ic.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.li .li-ic.info{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.li .li-ic.ai{background:var(--lime-soft);color:var(--lime-ink);border-color:transparent}
.li .li-b{flex:1;min-width:0}
.li .li-b b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .li-b small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--line-strong)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--primary-soft);color:var(--primary-ink)}.badge.warn{background:var(--amber-soft);color:var(--amber)}.badge.danger{background:var(--red-soft);color:var(--red)}.badge.info{background:var(--blue-soft);color:var(--blue)}.badge.ai{background:var(--lime-soft);color:var(--lime-ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.hia{background:var(--lime-soft);color:var(--lime-ink);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.chip .ic{width:15px;height:15px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp,.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:13px;padding:11px 13px;background:var(--surface);font-size:15px;outline:none}
.field textarea{min-height:96px;resize:none}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.check{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;cursor:pointer;padding:4px 0}
.check input{width:20px;height:20px;accent-color:var(--primary);margin:0;flex:0 0 auto}
.note{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;margin-top:12px}
.note .ic{width:15px;height:15px;margin-top:1px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:13px;background:var(--primary-soft);color:var(--ink)}
.banner>.ic{color:var(--primary);width:18px;height:18px;margin-top:1px}
.banner.warn{background:var(--amber-soft)}.banner.warn>.ic{color:var(--amber)}
.banner.ai{background:var(--lime-soft)}.banner.ai>.ic{color:var(--lime-ink)}
.banner.off{background:var(--surface-2);border:1px dashed var(--line-strong)}.banner.off>.ic{color:var(--muted)}
.msg{font-size:13px;color:var(--amber);min-height:18px;margin:8px 0 0}

/* ---------- login ---------- */
.login{flex:1;display:flex;flex-direction:column;background:linear-gradient(170deg,#0f3530 0%,#0b2420 60%,#081a17 100%);color:#fff;padding:0 28px 34px;position:relative;overflow:hidden}
.login:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-180px;top:-120px;background:radial-gradient(circle,rgba(25,179,163,.35),transparent 65%)}
.login .lg-top{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#19b3a3,#0b7d72);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(11,125,114,.45)}
.logo .ic{width:34px;height:34px}
.login h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:22px 0 8px}
.login p{color:#9cc0b8;font-size:15px;line-height:1.5}
.pillars{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}
.pillars span{font-size:11.5px;font-weight:600;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 9px;color:#cfe3df}
.pillars span:nth-child(3){border-color:rgba(185,214,58,.5);color:var(--lime)}
.gbtn{height:54px;border-radius:16px;border:0;background:#fff;color:#1f2a28;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;cursor:pointer;position:relative}
.gbtn svg{width:22px;height:22px}
.login small{display:block;text-align:center;color:#7fa39c;font-size:12px;margin-top:14px}

/* ---------- home ---------- */
.hero{background:var(--brand);color:#fff;padding:6px 16px 58px;flex:0 0 auto}
.hero-top{display:flex;align-items:center;gap:10px;min-height:52px}
.hero-top .av{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;font-size:14px}
.hero-top .t{flex:1}
.hero-top .t small{display:block;color:#8fb1aa;font-size:12.5px}
.hero-top .t b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.hero .ib{color:#fff}
.hero .ib .dot{box-shadow:0 0 0 2px var(--brand)}
.park-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:500;margin-top:8px;color:#d6e8e4;cursor:pointer}
.park-chip .ic{width:14px;height:14px}
.home-body{margin-top:-46px;padding:0 16px 24px}
.sync-card{display:flex;align-items:center;gap:12px}
.sync-card .s-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink);flex:0 0 auto}
.sync-card .s-ic.off{background:var(--surface-2);color:var(--muted)}
.sync-card .s-b{flex:1;min-width:0}
.sync-card b{font-size:14px;display:block}
.sync-card small{font-size:12.5px;color:var(--muted);display:block}
.qr-cta{display:flex;align-items:center;gap:14px;margin-top:12px;background:linear-gradient(135deg,#0f8a7e,#0b6f66);color:#fff;border:0;border-radius:20px;padding:16px;width:100%;text-align:left;cursor:pointer;box-shadow:0 10px 24px rgba(11,111,102,.28)}
.qr-cta .q{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.qr-cta .q .ic{width:28px;height:28px}
.qr-cta b{display:block;font-size:16px}
.qr-cta small{display:block;color:#c8ebe6;font-size:12.5px;margin-top:2px}
.qr-cta>.ic{margin-left:auto}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:500;text-align:center;line-height:1.25;cursor:pointer;padding:0}
.act .a-ic{width:56px;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--primary-ink);box-shadow:var(--shadow)}
.act .a-ic.r{color:var(--red)}.act .a-ic.a{color:var(--amber)}.act .a-ic.b{color:var(--blue)}
.act .a-ic .ic{width:24px;height:24px}

/* ---------- scanner ---------- */
.scanner{flex:1;background:#000;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scanner .cam{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a4a46 0%,#151d1b 55%,#050807 100%)}
.scanner .cam:before{content:"";position:absolute;left:18%;right:22%;top:24%;bottom:42%;background:linear-gradient(160deg,#5c6b66,#2d3835);border-radius:10px;opacity:.55;transform:rotate(-4deg)}
.scan-top{position:relative;display:flex;align-items:center;gap:6px;padding:8px}
.scan-top .ib{color:#fff;background:rgba(255,255,255,.08)}
.scan-top b{flex:1;text-align:center;font-size:16px}
.frame{position:relative;margin:34px auto 0;width:250px;height:250px;cursor:pointer}
.frame i{position:absolute;width:44px;height:44px;border:4px solid var(--lime)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.frame .line{position:absolute;left:14px;right:14px;height:2px;background:var(--lime);box-shadow:0 0 14px 3px rgba(185,214,58,.6);animation:scan 2s ease-in-out infinite}
.frame .ghost{position:absolute;inset:48px;opacity:.28;color:#fff}
.frame .ghost svg{width:100%;height:100%}
@keyframes scan{0%,100%{top:14px}50%{top:232px}}
.scan-hint{position:relative;text-align:center;margin-top:22px;font-size:14px;color:#d9e4e1}
.scan-hint small{display:block;color:#8aa29c;font-size:12px;margin-top:4px}
.scan-bottom{position:relative;margin-top:auto;background:rgba(18,26,24,.92);border-radius:24px 24px 0 0;padding:16px 16px 20px}
.scan-bottom .lbl{color:#9cb4ae}
.scan-bottom .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff}
.scan-bottom .row{display:flex;justify-content:space-around;margin-top:16px}
.scan-bottom .row button{border:0;background:none;color:#cfe0dc;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;cursor:pointer}
.scan-bottom .row .c{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.on{animation:fl .35s ease}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

/* ---------- status QR ---------- */
.st-head{padding:20px 18px 22px;color:#fff}
.st-head.ok{background:linear-gradient(160deg,#0f8a7e,#0a6b62)}
.st-head.warn{background:linear-gradient(160deg,#b9770f,#93590a)}
.st-head .big{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:12px}
.st-head .big .ic{width:30px;height:30px;stroke-width:2.2}
.st-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.st-head p{color:rgba(255,255,255,.82);font-size:13px;margin-top:3px}
.st-head .when{display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,.16);border-radius:9px;padding:5px 9px;font-size:12px;margin-top:12px}
.st-head .when .ic{width:14px;height:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-size:13.5px}

/* ---------- stepper ---------- */
.stepper{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 12px;flex:0 0 auto}
.stepper .bars{display:flex;gap:4px}
.stepper .bars i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper .bars i.on{background:var(--primary)}
.stepper .bars i.cur{background:var(--lime)}
.stepper .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.stepper .lab b{color:var(--ink);font-size:13px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:9px;cursor:pointer;width:100%;text-align:left}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center}
.opt.on .radio{border-color:var(--primary)}
.opt.on .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.opt .o-b{flex:1;min-width:0}
.opt b{display:block;font-size:14px}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.opt.warn{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 13px 12px;margin-bottom:10px}
.ci .ci-t{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;font-size:14px;font-weight:500}
.ci .ci-t .tag{flex:0 0 auto}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:11px}
.tri button{height:38px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tri button.c.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tri button.nc.on{background:var(--red);border-color:var(--red);color:#fff}
.tri button.na.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.yn{display:flex;gap:6px}
.yn button{height:34px;min-width:58px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.yn button.on.y{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.yn button.on.n{background:var(--red);border-color:var(--red);color:#fff}
.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ph{width:62px;height:50px;border-radius:10px;background:linear-gradient(135deg,#7aa59d,#2f5a53);position:relative;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:10px;font-weight:600}
.ph:after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.15) 50%,transparent 55%)}
.addph{height:50px;padding:0 12px;border-radius:10px;border:1.5px dashed var(--line-strong);background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--primary-ink)}
.addph.req{border-color:var(--amber);color:var(--amber)}
.nc-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong)}
.risk-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 11px;border-radius:10px}
.sig{width:100%;height:150px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface);touch-action:none;display:block;cursor:crosshair}
.qty{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:13px;overflow:hidden;height:48px;width:150px}
.qty button{width:48px;height:100%;border:0;background:var(--surface-2);font-size:20px;cursor:pointer}
.qty input{flex:1;border:0;text-align:center;font-weight:700;font-size:16px;background:var(--surface);min-width:0;height:100%;outline:none}
.done{text-align:center;padding:30px 10px 10px}
.done .d-ic{width:84px;height:84px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.done .d-ic.warn{background:var(--amber-soft);color:var(--amber)}
.done .d-ic .ic{width:42px;height:42px;stroke-width:2.2}
.done h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.done p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:inline-block;border:1px solid var(--line);margin-top:18px}
.qr{color:#10221f;display:block}
.ai-out{background:var(--lime-soft);border-radius:14px;padding:12px 13px;font-size:13px;margin-top:10px}
.ai-out b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--lime-ink);margin:8px 0 2px}
.ai-out b:first-child{margin-top:0}

/* ---------- overlays ---------- */
.scrim{position:absolute;inset:0;background:rgba(5,18,16,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;z-index:60;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:86%;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line-strong);margin:10px auto 4px}
.sheet .sh-b{overflow-y:auto;padding:10px 18px 22px}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.snack{position:absolute;left:14px;right:14px;bottom:88px;background:#16302b;color:#e8f2f0;border-radius:14px;padding:12px 14px;font-size:13.5px;z-index:80;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:snk .25s ease}
.snack .ic{color:var(--lime);width:18px;height:18px}
@keyframes snk{from{transform:translateY(12px);opacity:0}}
.loading{position:absolute;inset:0;z-index:90;background:rgba(6,20,18,.55);display:grid;place-items:center}
.loading .box{background:var(--surface);border-radius:22px;padding:24px 22px;width:270px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading b{display:block;font-size:15px}
.loading small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.prog{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--primary);transition:width .5s}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line-strong);position:relative;border:0;cursor:pointer;flex:0 0 auto;transition:background .2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--primary)}
.toggle.on:after{transform:translateX(18px)}

function push(name,p){S.stack.push({name:name,params:p||{}});render("push");}

function tab(name){S.stack=[{name:name,params:{}}];render("fade");}
function replace(name,p){S.stack[S.stack.length-1]={name:name,params:p||{}};render("fade");}
function rerender(){render("");}
function render(anim){
  const top=S.stack[S.stack.length-1],scr=SCREENS[top.name](top.params);

  $$("[data-back]",app).forEach(b=>b.addEventListener("click",pop));

function doSync(){
  if(!S.online){snack("Sem conexão. Os registros continuam salvos no aparelho.");return;}
  const n=S.queue.length;
  loading("Sincronizando",[n?"Enviando "+n+" registro"+(n>1?"s":"")+"…":"Verificando registros…","Atualizando status do dia…","Baixando atividades e checklists publicados…"],()=>{
    const payload={time:"Hoje, "+hhmm(),incidents:[],deliveries:[],permits:[],deviations:[],inspections:[],trainings:[]};
    S.queue.forEach(q=>{const k={incident:"incidents",epi:"deliveries",permit:"permits",deviation:"deviations",inspection:"inspections",training:"trainings"}[q.kind];if(k&&q.data)payload[k].push(q.data);
      S.sent.unshift({icon:q.icon,title:q.title,sub:q.sub.split(" · ")[0]+" · enviado hoje "+hhmm(),status:"Enviado"});});
    S.queue=[];S.lastSync="Hoje, "+hhmm();
    try{window.parent.postMessage({type:"safelist-sync",payload:payload},"*");}catch(e){}
    rerender();snack(n?n+" registro"+(n>1?"s enviados":" enviado")+". Status do dia atualizado.":"Tudo em dia. Status do dia atualizado.");});
}

    return{title:x.id,sub:x.activity,body:'<div class="done"><div class="d-ic '+(ok?"":"warn")+'">'+ic(ok?"checkc":"clock")+'</div><h2>'+(ok?"Atividade liberada":"Aguardando validação")+'</h2><p>'+esc(x.place)+'<br>'+(ok?"Validada por Marcos Lima. Apresente o QR da liberação quando solicitado.":"Marcos Lima (supervisor) foi notificado. Você será avisado quando houver validação.")+'</p><div class="qrbox">'+qrSvg(x.id,150)+'</div></div><div class="sec-t"><h2>Equipe</h2></div><div class="list">'+x.team.map(t=>li({i:"user",title:t,sub:"Documentação conferida",right:" "})).join("")+'</div>'+(ok?"":'<button class="btn block" type="button" id="sim-val" style="margin-top:16px">'+ic("check")+'Simular validação do supervisor</button>'),
      mount:a=>{const b=$("#sim-val",a);if(b)b.addEventListener("click",()=>{x.status="Liberada";x.step=6;rerender();snack(x.id+" validada por Marcos Lima.");});}};}
  if(p.step===undefined){p.step=0;}
  p.act=p.act===undefined?null:p.act;p.team=p.team||{};p.ver=p.ver||{};p.chk=p.chk||{};p.ph=p.ph||{};p.ctrl=p.ctrl||{};p.place=p.place||"Aerogerador TS-07";
  const A=p.act!==null?activities[p.act]:null;
  const top='<div class="stepper"><div class="bars">'+PSTEPS.map((s,i)=>'<i class="'+(i<p.step?"on":i===p.step?"cur":"")+'"></i>').join("")+'</div><div class="lab"><b>'+PSTEPS[p.step]+'</b><span>Passo '+(p.step+1)+' de 6</span></div></div>';
  let body="";
  const VER=["Permissão de trabalho emitida","Área isolada e sinalizada","Condições climáticas adequadas","Comunicação por rádio testada"];
  if(p.step===0){body='<p class="lbl">Qual atividade será realizada?</p>'+activities.map((a,i)=>'<button type="button" class="opt'+(p.act===i?" on":"")+'" data-act="'+i+'"><span class="radio"></span><span class="o-b"><b>'+a.name+'</b><small>'+a.risks.join(" · ")+'</small></span></button>').join("")+
    '<div class="field" style="margin-top:14px"><label for="lb-place">Local da atividade</label><select id="lb-place">'+["Aerogerador TS-07","Aerogerador TS-11","Subestação TS-SE1","Acesso norte · TS-02 a TS-11"].map(x=>'<option'+(x===p.place?" selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="kv"><div><small>Data e hora</small><b>'+today+' · '+hhmm()+'</b></div><div><small>Responsável</small><b>Tiago Santos</b></div></div>';}
  if(p.step===1){const v=A.sev*A.prob,lv=v>=15?["Alto","danger"]:v>=8?["Moderado","warn"]:["Baixo","ok"];
    body='<div class="card"><p class="lbl">Riscos da atividade</p><div style="display:flex;gap:6px;flex-wrap:wrap">'+A.risks.map(r=>'<span class="badge warn">'+r+'</span>').join("")+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="lbl" style="margin:0">Risco inicial (S'+A.sev+' × P'+A.prob+')</span><span class="risk-pill badge '+lv[1]+'">'+lv[0]+' · '+v+'</span></div></div>'+
    '<div class="sec-t"><h2>Medidas de controle</h2></div>'+A.controls.map((c,i)=>'<label class="opt'+(p.ctrl[i]?" on":"")+'" style="cursor:pointer"><input type="checkbox" data-ctrl="'+i+'" '+(p.ctrl[i]?"checked":"")+' style="width:20px;height:20px;accent-color:var(--primary)"><span class="o-b"><b>'+c+'</b><small>Controle aplicado no local</small></span></label>').join("")+
    '<button class="btn ai block" type="button" id="nb-proc" style="margin-top:6px">'+ic("book")+'Consultar procedimento · NotebookLM</button><p class="note">'+ic("sparkles")+'<span><span class="tag hia">Humano + IA</span> A IA apoia a consulta documental. A avaliação e a decisão permanecem humanas.</span></p>';}
  if(p.step===2){body='<p class="lbl">Selecione a equipe executante</p>'+workers.map(w=>'<button type="button" class="opt'+(p.team[w.name]?" on":"")+(w.ok?"":" warn")+'" data-w="'+esc(w.name)+'"><span class="radio" style="border-radius:6px"></span><span class="o-b"><b>'+w.name+'</b><small>'+w.co+' · '+(w.ok?"documentação regular":w.why)+'</small></span>'+badge(w.ok?"Regular":"Atenção",w.ok?"ok":"warn")+'</button>').join("")+
    '<button class="btn block" type="button" id="scan-badge" style="margin-top:6px">'+ic("qr")+'Ler QR do crachá</button>'+(Object.keys(p.team).some(k=>p.team[k]&&!workers.find(w=>w.name===k).ok)?'<div class="banner warn" style="margin-top:12px">'+ic("alert")+'<span>Há integrante com pendência. A liberação segue, mas o supervisor verá o alerta na validação.</span></div>':"");}
  if(p.step===3){body='<p class="lbl">Verificações antes de iniciar</p>'+VER.map((v,i)=>'<div class="ci"><div class="ci-t" style="align-items:center"><span>'+v+'</span><span class="yn"><button type="button" class="y'+(p.ver[i]==="s"?" on":"")+'" data-v="'+i+'" data-a="s">Sim</button><button type="button" class="n'+(p.ver[i]==="n"?" on":"")+'" data-v="'+i+'" data-a="n">Não</button></span></div></div>').join("")+(Object.values(p.ver).includes("n")?'<div class="banner warn">'+ic("alert")+'<span>Verificação com “Não” bloqueia o início. Corrija a condição ou registre um desvio.</span></div>':"");}
  if(p.step===4){body='<p class="lbl">Checklist · '+A.name+'</p>'+A.checks.map((c,i)=>'<div class="ci"><div class="ci-t"><span>'+c.text+'</span>'+(c.photo?'<span class="tag">'+ic("camera").replace('class="ic "','class="ic" style="width:12px;height:12px;vertical-align:-2px"')+' foto</span>':"")+'</div><div class="tri" style="grid-template-columns:1fr 1fr"><button type="button" class="c'+(p.chk[i]==="c"?" on":"")+'" data-c="'+i+'" data-a="c">Conforme</button><button type="button" class="nc'+(p.chk[i]==="nc"?" on":"")+'" data-c="'+i+'" data-a="nc">Não conforme</button></div>'+(c.photo?'<div class="photos">'+'<span class="ph">07:5'+i+'</span>'.repeat(p.ph[i]||0)+'<button type="button" class="addph'+(p.ph[i]?"":" req")+'" data-ph="'+i+'">'+ic("camera")+(p.ph[i]?"Mais":"Foto obrigatória")+'</button></div>':"")+'</div>').join("");}
  if(p.step===5){const tm=Object.keys(p.team).filter(k=>p.team[k]);
    body='<div class="card"><div class="kv" style="grid-template-columns:1fr"><div style="border:0;padding:0"><small>Atividade</small><b>'+A.name+' · '+esc(p.place)+'</b></div></div></div><div class="list" style="margin-top:12px">'+li({i:"alert",t:"ok",title:"Avaliação de risco",sub:A.controls.length+" controles aplicados",right:ic("check")})+li({i:"users",t:"ok",title:"Equipe",sub:tm.length+" pessoas · "+tm.map(x=>x.split(" ")[0]).join(", "),right:ic("check")})+li({i:"list",t:"ok",title:"Verificações",sub:"4 de 4 confirmadas",right:ic("check")})+li({i:"camera",t:"ok",title:"Checklist e evidências",sub:A.checks.length+" itens · "+Object.values(p.ph).reduce((s,x)=>s+x,0)+" fotos",right:ic("check")})+'</div>'+
      '<div class="field" style="margin-top:16px"><label for="lb-sup">Validação por</label><select id="lb-sup"><option>Marcos Lima · Supervisor</option><option>Helena Prado · Gerência</option></select></div><p class="note">'+ic("info")+'Validar correções e liberar a atividade é decisão e responsabilidade técnica humana. '+(S.online?"":"Sem conexão: a solicitação será enviada na próxima sincronização.")+'</p>';}
  const can=[A!==null,A&&A.controls.every((c,i)=>p.ctrl[i]),Object.values(p.team).some(Boolean),VER.every((v,i)=>p.ver[i]==="s"),A&&A.checks.every((c,i)=>p.chk[i]&&(!c.photo||p.ph[i])),true][p.step];
  return{title:p.resume?p.resume:"Liberação de atividade",sub:A?A.name:"Nova liberação",top:top,body:body,
    footer:(p.step>0?'<button class="btn" type="button" id="lb-prev">Voltar</button>':"")+'<button class="btn primary" type="button" id="lb-next"'+(can?"":" disabled")+'>'+(p.step===5?ic("send")+"Enviar para validação":"Continuar")+'</button>',
    mount:a=>{
      const set=(fn)=>e=>{fn(e);rerender();};
      $$("[data-act]",a).forEach(b=>b.addEventListener("click",set(()=>{p.act=+b.dataset.act;p.ctrl={};p.chk={};p.ph={};})));
      const pl=$("#lb-place",a);if(pl)pl.addEventListener("change",()=>p.place=pl.value);
      $$("[data-ctrl]",a).forEach(b=>b.addEventListener("change",set(()=>{p.ctrl[b.dataset.ctrl]=b.checked;})));
      $$("[data-w]",a).forEach(b=>b.addEventListener("click",set(()=>{p.team[b.dataset.w]=!p.team[b.dataset.w];})));
      const sb=$("#scan-badge",a);if(sb)sb.addEventListener("click",()=>{p.team["Ana Paula Nascimento"]=true;rerender();snack("Crachá lido: Ana Paula Nascimento · documentação regular.");});
      $$("[data-v]",a).forEach(b=>b.addEventListener("click",set(()=>{p.ver[b.dataset.v]=b.dataset.a;})));
      $$("[data-c]",a).forEach(b=>b.addEventListener("click",set(()=>{p.chk[b.dataset.c]=b.dataset.a;})));
      $$("[data-ph]",a).forEach(b=>b.addEventListener("click",()=>{const f=document.createElement("div");f.className="flash on";$("#device").appendChild(f);setTimeout(()=>f.remove(),400);p.ph[b.dataset.ph]=(p.ph[b.dataset.ph]||0)+1;const st=$("#content").scrollTop;rerender();$("#content").scrollTop=st;}));
      const nb=$("#nb-proc",a);if(nb)nb.addEventListener("click",()=>sheet('<h3>'+ic("book")+' Procedimento consultado</h3><p class="sub">NotebookLM · base de procedimentos e requisitos</p><div class="ai-out"><b>Fonte</b>PRO-SST-012 · '+A.name+' · rev. 4<b>Pontos de atenção</b>'+A.controls.map(c=>"• "+c).join("<br>")+'<br>• Interromper a atividade em ventos acima de 40 km/h<b>Lembrete</b>Confira no local antes de marcar os controles. A IA não substitui a verificação em campo.</div><button class="btn block" type="button" style="margin-top:14px" id="sh-ok">Entendi</button>',s=>$("#sh-ok",s).addEventListener("click",closeSheet)));
      const prev=$("#lb-prev",a);if(prev)prev.addEventListener("click",()=>{p.step--;render("pop");});
      $("#lb-next",a).addEventListener("click",()=>{
        if(p.step<5){p.step++;render("push");return;}
        const id=p.resume||("LIB-0"+(S.n.lib++));const tm=Object.keys(p.team).filter(k=>p.team[k]);
        let x=S.permits.find(y=>y.id===id);if(!x){x={id:id};S.permits.unshift(x);}Object.assign(x,{activity:A.name,place:p.place,step:5,status:"Aguardando validação",team:tm});
        enqueue({kind:"permit",icon:"filecheck",title:id+" · "+A.name,sub:"Liberação · "+hhmm(),data:{id:id,activity:A.name,park:"Terra Santa",place:p.place,team:tm,company:"Flexwind Serviços",step:5,status:"Aguardando validação",supervisor:$("#lb-sup",a).value.split(" · ")[0],date:today+" "+hhmm(),by:"Tiago Santos"}});
        S.stack=[{name:"atividades",params:{}},{name:"liberacao",params:{view:id}}];render("push");snack(S.online?"Liberação salva. Sincronize para notificar o supervisor.":"Salva no aparelho. Será enviada na sincronização.");});
    }};
};

/* ---------- QR ---------- */
SCREENS.qr=function(){
  const samples=[[7,"Guindaste 50 t"],[6,"Veículo de apoio"],[5,"Ana Paula"],[2,"Caminhonete 4x4"],[4,"Flexwind"]];
  return{raw:'<div class="scanner"><div class="cam"></div><div class="flash" id="qr-flash"></div><div class="scan-top"><button class="ib" type="button" data-back aria-label="Fechar">'+ic("x")+'</button><b>Ler QR Code</b><button class="ib" type="button" id="torch" aria-label="Lanterna">'+ic("flashl")+'</button></div>'+
    '<div class="frame" id="frame" role="button" tabindex="0" aria-label="Simular leitura"><i></i><i></i><i></i><i></i><div class="ghost">'+qrSvg("MAQ-0017",154).replace('class="qr"','class="qr" style="color:#fff"').replace(/fill="#fff"/g,'fill="transparent"')+'</div><div class="line"></div></div>'+
    '<div class="scan-hint">Aponte para a etiqueta do recurso<small>'+(S.online?"Online · consulta o status mais recente":"Offline · usa o status do dia ("+S.lastSync+")")+'</small></div>'+
    '<div class="scan-bottom"><p class="lbl">Demonstração · toque para simular a leitura</p><div class="chips" style="margin:0 -16px">'+samples.map(s=>'<button class="chip" type="button" data-s="'+s[0]+'">'+ic("qr")+s[1]+'</button>').join("")+'</div><div class="row"><button type="button" id="qr-type"><span class="c">'+ic("keyboard")+'</span>Digitar código</button><button type="button" id="qr-gal"><span class="c">'+ic("image")+'</span>Galeria</button><button type="button" data-push="consulta"><span class="c">'+ic("search")+'</span>Buscar</button></div></div></div>',camTop:true,
    mount:a=>{const go=i=>{$("#qr-flash",a).classList.add("on");if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}setTimeout(()=>{S.stack.pop();push("status",{rec:i});},260);};
      $$("[data-s]",a).forEach(b=>b.addEventListener("click",()=>go(+b.dataset.s)));
      $("#frame",a).addEventListener("click",()=>go(7));
      $("#torch",a).addEventListener("click",e=>e.currentTarget.style.background=e.currentTarget.style.background?"":"rgba(185,214,58,.35)");
      $("#qr-type",a).addEventListener("click",()=>sheet('<h3>Digitar código</h3><p class="sub">Use o código impresso abaixo do QR.</p><div class="field"><input class="inp" id="code" value="VEI-00482" aria-label="Código"></div><button class="btn primary block" type="button" id="code-go">Consultar</button>',s=>$("#code-go",s).addEventListener("click",()=>{const v=$("#code",s).value.toUpperCase();const i=records.findIndex(r=>r.id.toUpperCase().includes(v));closeSheet();if(i<0){snack("Código não encontrado neste parque.");return;}go(i);})));
      $("#qr-gal",a).addEventListener("click",()=>go(2));}};
};

/* ---------- Status do recurso ---------- */
SCREENS.status=function(p){const r=records[p.rec],ok=r.state==="Regular",parts=r.docs.match(/(\d+) de (\d+)/),ap=+parts[1],tot=+parts[2];
  const docs=(DOC_TYPES[r.kind]||[]).slice(0,tot).map((n,i)=>({n:n,ok:i<ap}));
  const open=r.name==="Guindaste 50 t"?[["flag","NC-TS-003 · Vazamento no cilindro","Em execução · prazo 05/11"]]:r.name==="Caminhonete 4x4"?[["flag","NC-MR-004 · Extintor sem lacre","Aguardando validação"]]:[];
  return{title:"Status do cadastro",sub:r.id,pad:false,
    body:'<div class="st-head '+(ok?"ok":"warn")+'"><div class="big">'+ic(ok?"checkc":"alert")+'</div><h2>'+(ok?"Liberado para uso":"Precisa de atenção")+'</h2><p>'+esc(r.name)+' · '+r.kind+' · Parque de '+r.park+'</p><span class="when">'+ic(S.online?"wifi":"wifioff")+(S.online?"Atualizado agora":"Status do dia · "+S.lastSync)+'</span></div>'+
      '<div style="padding:16px">'+(S.online?"":'<div class="banner off" style="margin-bottom:12px">'+ic("wifioff")+'<span>Sem conexão. Mostrando o status de hoje, guardado na última sincronização.</span></div>')+
      '<div class="kv"><div><small>Empresa / responsável</small><b>'+esc(r.owner)+'</b></div><div><small>Documentos</small><b>'+ap+' de '+tot+' aprovados</b></div><div><small>Próximo vencimento</small><b>'+esc(r.due)+'</b></div><div><small>Código</small><b>'+esc(r.id.split(" · ")[0])+'</b></div></div>'+
      '<div class="sec-t"><h2>Documentos</h2></div><div class="list">'+docs.map(d=>li({i:"file",t:d.ok?"ok":"warn",title:d.n,sub:d.ok?"Aprovado · válido":"Pendente de envio pelo fornecedor",right:badge(d.ok?"Aprovado":"Pendente")})).join("")+'</div>'+
      (open.length?'<div class="sec-t"><h2>Em aberto neste componente</h2></div><div class="list">'+open.map(o=>li({i:o[0],t:"warn",title:o[1],sub:o[2],right:" "})).join("")+'</div>':"")+
      '<div class="sec-t"><h2>Histórico</h2></div><div class="list">'+li({i:"qr",title:"Leitura de QR",sub:"Hoje, "+hhmm()+" · Tiago Santos",right:" "})+li({i:"shield",title:"Última inspeção",sub:"30/10/2026 · conforme",right:" "})+'</div><div style="height:8px"></div></div>',
    footer:'<button class="btn" type="button" id="st-chk">'+ic("list")+'Checklist</button><button class="btn primary" type="button" id="st-nc">'+ic("flag")+'Registrar NC</button>',
    mount:a=>{$("#st-nc",a).addEventListener("click",()=>push("desvio",{origin:r.name+" · "+r.id.split(" · ")[0]}));
      $("#st-chk",a).addEventListener("click",()=>{const m=r.kind==="Veículo"?"Veículos leves":r.kind==="Máquina"?"Máquinas":null;if(!m){snack("Checklists disponíveis para veículos, máquinas e equipamentos.");return;}push("runner",{title:m,sub:r.name,items:TOPIC_ITEMS[m]});});}};
};

/* ---------- Inspeção geral / checklists ---------- */
SCREENS.inspecao=function(){return{title:"Inspeção geral",sub:"Direcionada à atividade e ao contexto do campo",
  body:'<div class="banner">'+ic("info")+'<span>Escolha o contexto encontrado no campo. O checklist é montado a partir dos modelos publicados pela equipe de segurança.</span></div>'+GENERAL.map(g=>'<div class="sec-t"><h2 style="display:flex;gap:8px;align-items:center">'+ic(g[1])+g[0]+'</h2></div><div class="list">'+g[2].map(t=>li({i:"shield",t:"info",title:t,sub:(TOPIC_ITEMS[t]||DEFAULT_ITEMS).length+" itens de verificação",attr:" data-t=\""+t+"\""})).join("")+'</div>').join(""),
  mount:a=>$$("[data-t]",a).forEach(b=>b.addEventListener("click",()=>push("runner",{title:"Inspeção · "+b.dataset.t,sub:"Parque de Terra Santa",items:TOPIC_ITEMS[b.dataset.t]||DEFAULT_ITEMS,kind:"Inspeção geral",object:b.dataset.t})))};};
SCREENS.checklists=function(){return{title:"Checklists",sub:"Máquinas, equipamentos, veículos e outros recursos",
  body:'<div class="list">'+CHECK_MODELS.map((m,i)=>li({i:m[1],t:"ok",title:m[0],sub:m[2].length+" recursos no parque · "+(TOPIC_ITEMS[m[0]]||DEFAULT_ITEMS).length+" itens",attr:" data-push=\"objetos\" data-p='{\"m\":"+i+"}'"})).join("")+'</div><button class="btn block" type="button" data-tab="qr" style="margin-top:14px">'+ic("qr")+'Identificar recurso pelo QR</button>'};};
SCREENS.objetos=function(p){const m=CHECK_MODELS[p.m];return{title:m[0],sub:"Selecione o recurso",
  body:'<div class="list">'+m[2].map(o=>li({i:m[1],title:o,sub:"Última inspeção: 30/10/2026",attr:' data-o="'+esc(o)+'"'})).join("")+'</div>',
  mount:a=>$$("[data-o]",a).forEach(b=>b.addEventListener("click",()=>push("runner",{title:m[0],sub:b.dataset.o,items:TOPIC_ITEMS[m[0]]||DEFAULT_ITEMS,kind:m[0],object:b.dataset.o})))};};
SCREENS.runner=function(p){p.ans=p.ans||{};p.ph=p.ph||{};p.txt=p.txt||{};
  const n=p.items.length,done=Object.keys(p.ans).length;
  return{title:p.title,sub:p.sub,top:'<div class="stepper"><div class="bars">'+p.items.map((x,i)=>'<i class="'+(p.ans[i]==="nc"?"cur":p.ans[i]?"on":"")+'"></i>').join("")+'</div><div class="lab"><b>'+done+' de '+n+' respondidos</b><span>'+Object.values(p.ans).filter(x=>x==="nc").length+' não conformes</span></div></div>',
    body:p.items.map((t,i)=>'<div class="ci"><div class="ci-t"><span>'+(i+1)+'. '+t+'</span></div><div class="tri"><button type="button" class="c'+(p.ans[i]==="c"?" on":"")+'" data-i="'+i+'" data-a="c">Conforme</button><button type="button" class="nc'+(p.ans[i]==="nc"?" on":"")+'" data-i="'+i+'" data-a="nc">Não conforme</button><button type="button" class="na'+(p.ans[i]==="na"?" on":"")+'" data-i="'+i+'" data-a="na">N/A</button></div>'+
      (p.ans[i]==="nc"?'<div class="nc-box"><textarea class="inp" data-tx="'+i+'" rows="2" placeholder="Descreva o desvio encontrado" style="min-height:64px;resize:none">'+esc(p.txt[i]||"")+'</textarea><div class="photos">'+'<span class="ph">'+hhmm()+'</span>'.repeat(p.ph[i]||0)+'<button type="button" class="addph'+(p.ph[i]?"":" req")+'" data-ph="'+i+'">'+ic("camera")+(p.ph[i]?"Mais":"Evidência")+'</button></div></div>':"")+'</div>').join("")+
      '<p class="note">'+ic("info")+'Itens não conformes geram desvios com evidência, vinculados a esta inspeção.</p>',
    footer:'<button class="btn primary" type="button" id="rn-end"'+(done===n?"":" disabled")+'>'+ic("check")+'Concluir inspeção</button>',
    mount:a=>{const keep=fn=>()=>{fn();const st=$("#content").scrollTop;rerender();$("#content").scrollTop=st;};
      $$("[data-i]",a).forEach(b=>b.addEventListener("click",keep(()=>{p.ans[b.dataset.i]=b.dataset.a;})));
      $$("[data-tx]",a).forEach(t=>t.addEventListener("input",()=>p.txt[t.dataset.tx]=t.value));
      $$("[data-ph]",a).forEach(b=>b.addEventListener("click",keep(()=>{const f=document.createElement("div");f.className="flash on";$("#device").appendChild(f);setTimeout(()=>f.remove(),400);p.ph[b.dataset.ph]=(p.ph[b.dataset.ph]||0)+1;})));
      $("#rn-end",a).addEventListener("click",()=>{const ncs=p.items.map((t,i)=>i).filter(i=>p.ans[i]==="nc");const c=Object.values(p.ans).filter(x=>x==="c").length;

SCREENS.epi=function(p){p.qty=p.qty||1;
  return{title:"Entregar EPI",sub:"Entrega, CA, motivo e validação",
    body:'<div class="field"><label for="ep-w">Trabalhador</label><select id="ep-w"><option value="">Selecionar trabalhador</option>'+workers.map(w=>'<option>'+w.name+'</option>').join("")+'</select></div>'+
      '<p class="lbl">EPI</p>'+epiStock.map((e,i)=>'<button type="button" class="opt'+(p.item===i?" on":"")+'" data-e="'+i+'"><span class="radio"></span><span class="o-b"><b>'+e.name+'</b><small>'+e.ca+' · saldo '+e.stock+(e.stock<6?" · abaixo do mínimo":"")+'</small></span></button>').join("")+
      '<div style="display:flex;gap:12px;align-items:flex-end;margin-top:6px"><div class="field" style="margin:0"><label>Quantidade</label><div class="qty"><button type="button" id="q-m" aria-label="Diminuir">−</button><input id="ep-q" value="'+p.qty+'" inputmode="numeric" aria-label="Quantidade"><button type="button" id="q-p" aria-label="Aumentar">+</button></div></div><div class="field" style="margin:0;flex:1"><label for="ep-r">Motivo</label><select id="ep-r"><option>Entrega inicial</option><option>Substituição por desgaste</option><option>Substituição por dano</option><option>Extravio</option></select></div></div>'+
      '<div class="field" style="margin-top:14px"><label>Assinatura do trabalhador</label><canvas class="sig" id="sig" aria-label="Área de assinatura"></canvas><div style="display:flex;justify-content:space-between;margin-top:6px"><small class="muted" style="font-size:12px">Assine com o dedo</small><button type="button" class="btn sm" id="sig-clr" style="height:28px">Limpar</button></div></div>'+
      '<label class="check"><input type="checkbox" id="ep-ok"><span>Confirmo que a entrega foi realizada e que o trabalhador recebeu orientação de uso.</span></label><p class="msg" id="ep-m"></p>',
    footer:'<button class="btn primary" type="button" id="ep-s">'+ic("check")+'Salvar entrega</button>',
    mount:a=>{$$("[data-e]",a).forEach(b=>b.addEventListener("click",()=>{p.item=+b.dataset.e;p.w=$("#ep-w",a).value;$$("[data-e]",a).forEach(x=>x.classList.toggle("on",x===b));}));
      const q=$("#ep-q",a);$("#q-m",a).addEventListener("click",()=>q.value=Math.max(1,(+q.value||1)-1));$("#q-p",a).addEventListener("click",()=>q.value=(+q.value||0)+1);
      const c=$("#sig",a),ctx=c.getContext("2d");let drawn=false,down=false;const fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;ctx.scale(2,2);ctx.lineWidth=2.2;ctx.lineCap="round";ctx.strokeStyle=getComputedStyle(document.body).color;};setTimeout(fit,30);
      const pos=e=>{const r=c.getBoundingClientRect(),k=r.width/c.offsetWidth;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k];};
      c.addEventListener("pointerdown",e=>{down=true;drawn=true;c.setPointerCapture(e.pointerId);const xy=pos(e);ctx.beginPath();ctx.moveTo(xy[0],xy[1]);});
      c.addEventListener("pointermove",e=>{if(!down)return;const xy=pos(e);ctx.lineTo(xy[0],xy[1]);ctx.stroke();});
      c.addEventListener("pointerup",()=>down=false);$("#sig-clr",a).addEventListener("click",()=>{ctx.clearRect(0,0,c.width,c.height);drawn=false;});
      $("#ep-s",a).addEventListener("click",()=>{const m=$("#ep-m",a),w=$("#ep-w",a).value,qty=+q.value,it=epiStock[p.item];

        if(!$("#ep-ok",a).checked){m.textContent="Confirme o recebimento antes de salvar a entrega.";return;}
        if(qty>it.stock){m.textContent="O saldo disponível é insuficiente para esta entrega.";return;}
        it.stock-=qty;enqueue({kind:"epi",icon:"hardhat",title:it.name+" · "+w.split(" ")[0],sub:"Entrega de EPI · "+hhmm(),data:{date:today,worker:w,epi:it.name,qty:qty,reason:$("#ep-r",a).value,park:"Terra Santa"}});
        S.stack.pop();rerender();snack("Entrega registrada com assinatura. Saldo atualizado no aparelho.");});}};
};

      '<div class="sec-t"><h2>Acesso</h2></div><div class="list">'+row("lock","Perfil Técnico","Execução e registros · gestor: Marcos Lima","")+'<button type="button" class="li" data-push="consulta" data-p=\'{"park":"Maral"}\'><span class="li-ic">'+ic("pin")+'</span><span class="li-b"><b>Consultar outra unidade</b><small>'+(S.access.Maral==="pending"?"Solicitação para Maral aguardando aprovação":"Depende de aprovação do superior")+'</small></span><span class="chev">'+ic("chev")+'</span></button></div>'+
      '<div class="sec-t"><h2>Aparelho</h2></div><div class="list">'+row("moon","Tema escuro","",'<button type="button" class="toggle'+(S.theme==="dark"?" on":"")+'" id="pf-th" aria-label="Tema escuro"></button>')+row(S.online?"wifi":"wifioff","Simular sem conexão","Demonstração do modo offline",'<button type="button" class="toggle'+(S.online?"":" on")+'" id="pf-off" aria-label="Simular sem conexão"></button>')+row("refresh","Sincronização","Manual · última "+S.lastSync,'<button type="button" class="btn sm" data-sync>Agora</button>')+row("phone","Versão do app","Safelist 0.9 · protótipo","")+'</div>'+
      '<div class="sec-t"><h2>Sobre</h2></div><div class="list">'+row("sparkles","IA no ponto certo","Gem, Gemini e NotebookLM apoiam; a decisão é humana","")+'<button type="button" class="li" id="pf-out"><span class="li-ic danger">'+ic("logout")+'</span><span class="li-b"><b style="color:var(--red)">Sair</b><small>Registros não enviados ficam no aparelho</small></span></button></div>',
    mount:a=>{bindSync(a);$("#pf-th",a).addEventListener("click",()=>{setTheme(S.theme==="dark"?"light":"dark");rerender();});
      $("#pf-off",a).addEventListener("click",()=>{S.online=!S.online;statusbar();rerender();snack(S.online?"Conexão restabelecida.":"Modo offline: registros ficam salvos no aparelho.");});
      $("#pf-out",a).addEventListener("click",()=>{S.stack=[{name:"login",params:{}}];render("fade");});}};
};

/* =========================================================
   Inicialização
   ========================================================= */
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;}
window.addEventListener("message",e=>{const d=e.data||{};if(d.type==="safelist-theme"){setTheme(d.theme);rerender();}});
setTheme(params.get("theme")==="dark"?"dark":"light");
S.stack=[{name:params.has("skip-login")?"home":"login",params:{}}];render("");
})();
</script>
</body>
</html>
